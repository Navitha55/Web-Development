<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Activity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .heading {
            margin: 30px;
            font-size: 3rem;
            font-style: bold;
        }

        .container {
            margin: 20px;
        }

        #dog {
            height: 450px;
            width: 450px;
            border-radius: 30px;
        }

        .buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .activity {
            padding: 7px 15px 7px 15px;
            width: 100px;
            height: 50px;
            border-radius: 10px;
            border: 1px solid;
            color: white;
            font-size: 15px;
            font-style: oblique;
            cursor: pointer;
        }

        #eating {
            background-color: navy;
        }

        #sleeping {
            background-color: brown;
        }

        #playing {
            background-color: rgb(74, 143, 5);
        }
    </style>
</head>

<body>

    <div class="heading">Dog Activities</div>
    <div class="container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcST9UjitrpsLDBn81E7T6MBLb9JSMOr5lFtBKtU6dScSA&s=10"
            alt="" id="dog">
    </div>
    <div class="buttons">
        <button class="activity" id="eating"
            onclick="dogActivity('https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExanlpdm0ycHU3NTFyb3E1cGE2ZjljYjczdTRmbWkwbnQwZmx1N291MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/1DMfMOWF8Piec/giphy.gif')">Eating</button>
        <button class="activity" id="playing"
            onclick="dogActivity('https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ2JnMWdrdjJsZ244c2ZybjBwbzJ4YnI1anpmeGtxcDd3eDM0dHM4NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/B3GsZo2uPzCrbVSqyS/200.webp')">Playing</button>
        <button class="activity" id="sleeping"
            onclick="dogActivity('https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExeXRvaWNsdGd0aTNhOWIxOGRtNXA3ZHFvOXk0OWxpdmtycWJ3bDZsNSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/h7R28C8D4MGwHuShSp/giphy.webp')">Sleeping</button>
    </div>
    <script>
        function dogActivity(url) {
            let act = document.getElementById("dog");
            act.src = url
        }
    </script>
</body>

</html>
